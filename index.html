
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>:root {
  --bg: #fffdf5;
  --ink: #111111;
  --accent: #c7ff00;
  --secondary: #4a36ff;
  --danger: #ff4f4f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Inter, Arial, sans-serif;
  color: var(--ink);
  background:
    linear-gradient(transparent 31px, #ece8dc 32px),
    linear-gradient(90deg, transparent 31px, #ece8dc 32px);
  background-size: 32px 32px;
  background-color: var(--bg);
}

.app-shell {
  max-width: 780px;
  margin: 0 auto;
  display: grid;
  gap: 14px;
}

.topbar {
  border: 3px solid var(--ink);
  background: var(--accent);
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 6px 6px 0 var(--ink);
}

.badge {
  font-weight: 900;
  letter-spacing: 0.08em;
}

.run-btn {
  border: 3px solid var(--ink);
  background: #ffffff;
  padding: 8px 14px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
}

.run-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--ink);
}

.files {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.file {
  border: 3px solid var(--ink);
  background: #ffffff;
  border-radius: 999px;
  padding: 6px 12px;
  font-weight: 800;
  font-size: 14px;
}

.file-active {
  background: var(--secondary);
  color: #ffffff;
}

.editor-card,
.preview-card {
  border: 3px solid var(--ink);
  background: #ffffff;
  padding: 18px;
  box-shadow: 6px 6px 0 var(--ink);
}

h1,
h2 {
  margin: 0 0 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

p {
  margin: 0 0 12px;
  line-height: 1.5;
}

ul {
  margin: 0;
  padding-left: 18px;
}

li {
  margin: 6px 0;
}</style>
  </head>
  <body>
    <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST OS // CORE v5.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.9);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.4);
            --accent-2: #bc00ff;
            --text: #e2e8f0;
            --success: #10b981;
            --danger: #ff4757;
        }

        * { box-sizing: border-box; transition: 0.2s; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            color: var(--text); font-family: 'Noto Sans JP', sans-serif; margin: 0; min-height: 100vh;
        }

        /* --- UI Parts --- */
        nav {
            display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px); border-bottom: 1px solid var(--accent-glow);
            padding: 15px; position: sticky; top: 0; z-index: 100;
        }
        nav div { cursor: pointer; font-size: 0.7rem; color: #64748b; font-family: 'Orbitron'; font-weight: bold; }
        nav div.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        .view { max-width: 800px; margin: 30px auto; padding: 0 20px; display: none; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-card {
            background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .mission-card {
            background: rgba(255, 255, 255, 0.03); border-left: 4px solid var(--accent);
            padding: 15px; border-radius: 8px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center;
        }

        button {
            background: linear-gradient(135deg, var(--accent), #0099ff); color: #000;
            border: none; padding: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 10px;
        }
        button.secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); width: auto; padding: 5px 10px; font-size: 0.7rem; }

        input, select, textarea {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 12px;
        }

        .unit-chip {
            display: inline-flex; padding: 8px 12px; margin: 4px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer; font-size: 0.75rem;
        }
        .unit-chip.done { background: var(--success); color: white; border-color: transparent; }

        .vol-progress-bar {
            height: 10px; background: #334155; border-radius: 5px; overflow: hidden; margin: 10px 0;
        }
        .vol-progress-fill { height: 100%; background: var(--accent); width: 0%; }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.9); z-index: 200; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Orbitron'; color: var(--accent);
        }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div style="font-size: 3rem; margin-bottom: 20px;">⚡</div>
    <div>AI CALCULATION...</div>
</div>

<nav>
    <div onclick="switchView('home')" id="nav-home" class="active">HOME</div>
    <div onclick="switchView('settings')" id="nav-settings">設定</div>
    <div onclick="switchView('progress')" id="nav-progress">進捗</div>
    <div onclick="switchView('plan')" id="nav-plan">全体計画</div>
</nav>

<div id="view-home" class="view active">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
        <div class="glass-card" style="text-align: center;">
            <small style="opacity:0.6;">全体進捗</small>
            <div id="stability-info" style="font-family: 'Orbitron'; font-size: 1.8rem; color: var(--accent);">--%</div>
        </div>
        <div class="glass-card" style="text-align: center;">
            <small style="opacity:0.6;">試験まで</small>
            <div id="countdown-info" style="font-family: 'Orbitron'; font-size: 1.8rem; color: var(--accent-2);">--日</div>
        </div>
    </div>

    <div class="glass-card">
        <h3 style="font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">今日の学習ノルマ</h3>
        <div id="home-today-tasks"></div>
    </div>

    <button onclick="switchView('progress')">進捗を記録する</button>
    <button id="btn-gen-plan" onclick="generateAIPlan()" class="secondary">AIで計画を最適化する</button>
</div>

<div id="view-settings" class="view">
    <div class="glass-card">
        <h3 class="font-cyber">新規教材の追加</h3>
        <input id="ex-subject" placeholder="科目 (例: 英語)">
        <input id="ex-date" type="date">
        
        <select id="input-mode" onchange="toggleModeUI()">
            <option value="std">リスト形式 (ページ・問題番号など)</option>
            <option value="vol">量ベース (単語数・総ページ数など)</option>
        </select>
        
        <div id="std-ui">
            <input id="mat-name" placeholder="教材名 (例: 文法ワーク)">
            <textarea id="mat-range" placeholder="例: 1-20, 30, プリントA" rows="2"></textarea>
        </div>

        <div id="vol-ui" style="display: none;">
            <input id="vol-mat-name" placeholder="教材名 (例: ターゲット1900)">
            <div style="display: flex; gap: 10px;">
                <input id="vol-total" type="number" placeholder="全件数 (例: 1900)">
                <input id="vol-unit-name" placeholder="単位 (例: 語, P)">
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
            <span>周回数:</span>
            <input id="mat-rounds" type="number" value="3" min="1" style="width: 80px; margin: 0;">
        </div>
        
        <button onclick="saveExam()" style="margin-top: 15px;">保存する</button>
    </div>
    <div id="settings-list"></div>
</div>

<div id="view-progress" class="view">
    <h2 class="font-cyber">Progress LOG</h2>
    <div id="progress-list"></div>
</div>

<div id="view-plan" class="view">
    <h2 class="font-cyber">Full Strategy</h2>
    <div id="full-plan-list"></div>
</div>

<script>
let state = { exams: [], logs: [], plan: {} };

// --- SOUNDS ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'tap') {
        o.frequency.setValueAtTime(800, now); o.frequency.exponentialRampToValueAtTime(200, now + 0.1);
        g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        o.start(); o.stop(now + 0.1);
    } else if (type === 'ai') {
        o.type = 'square'; o.frequency.setValueAtTime(200, now); o.frequency.linearRampToValueAtTime(500, now + 0.4);
        g.gain.setValueAtTime(0.05, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        o.start(); o.stop(now + 0.4);
    }
}

// --- LOGIC ---
function switchView(id) {
    playSound('tap');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('nav div').forEach(n => n.classList.remove('active'));
    document.getElementById(`view-${id}`).classList.add('active');
    document.getElementById(`nav-${id}`).classList.add('active');
    render();
}

function toggleModeUI() {
    const mode = document.getElementById('input-mode').value;
    document.getElementById('std-ui').style.display = mode === 'std' ? 'block' : 'none';
    document.getElementById('vol-ui').style.display = mode === 'vol' ? 'block' : 'none';
}

function saveExam() {
    const subject = document.getElementById('ex-subject').value;
    const date = document.getElementById('ex-date').value;
    const rounds = parseInt(document.getElementById('mat-rounds').value) || 1;
    if (!subject || !date) return alert("必須項目を埋めてください");

    let exam = state.exams.find(e => e.subject === subject && e.date === date);
    if (!exam) { exam = { id: Date.now(), subject, date, materials: [] }; state.exams.push(exam); }

    const mode = document.getElementById('input-mode').value;
    if (mode === 'std') {
        const name = document.getElementById('mat-name').value;
        const rawRange = document.getElementById('mat-range').value;
        const tasks = rawRange.split(',').map(r => ({ label: r.trim(), done: false }));
        exam.materials.push({ id: Date.now()+1, name, type: 'std', tasks, rounds, unit: 'U' });
    } else {
        const name = document.getElementById('vol-mat-name').value;
        const total = parseInt(document.getElementById('vol-total').value);
        const unit = document.getElementById('vol-unit-name').value;
        exam.materials.push({ id: Date.now()+1, name, type: 'vol', total, doneCount: 0, rounds, unit });
    }
    playSound('tap');
    render();
    alert("保存しました");
}

function generateAIPlan() {
    if (state.exams.length === 0) return;
    document.getElementById('loading-overlay').style.display = 'flex';
    playSound('ai');

    setTimeout(() => {
        state.plan = {};
        const today = new Date(); today.setHours(0,0,0,0);
        
        state.exams.forEach(exam => {
            const diff = Math.ceil((new Date(exam.date) - today) / 86400000);
            if (diff <= 0) return;

            exam.materials.forEach(mat => {
                const totalWork = (mat.type === 'std' ? mat.tasks.length : mat.total) * mat.rounds;
                const doneWork = mat.type === 'std' ? state.logs.filter(l => l.matId === mat.id).length : mat.doneCount;
                const remaining = Math.max(0, totalWork - doneWork);
                const daily = Math.ceil(remaining / diff);

                for (let i = 0; i < diff; i++) {
                    const d = new Date(); d.setDate(today.getDate() + i);
                    const k = d.toISOString().split('T')[0];
                    if (!state.plan[k]) state.plan[k] = [];
                    state.plan[k].push({ matId: mat.id, subject: exam.subject, matName: mat.name, amount: daily, unit: mat.unit });
                }
            });
        });
        document.getElementById('loading-overlay').style.display = 'none';
        switchView('home');
    }, 600);
}

function updateProgress(matId, val, isStd = false) {
    if (isStd) {
        const idx = state.logs.findIndex(l => l.matId === matId && l.label === val);
        if (idx > -1) state.logs.splice(idx, 1);
        else state.logs.push({ matId, label: val });
    } else {
        const mat = state.exams.flatMap(e => e.materials).find(m => m.id === matId);
        if (mat) mat.doneCount = parseInt(val) || 0;
    }
    render();
}

function render() {
    const today = new Date().toISOString().split('T')[0];
    
    // --- HOME ---
    let tTotal = 0, tDone = 0;
    state.exams.forEach(e => e.materials.forEach(m => {
        tTotal += (m.type === 'std' ? m.tasks.length : m.total) * m.rounds;
        tDone += (m.type === 'std' ? state.logs.filter(l => l.matId === m.id).length : m.doneCount);
    }));
    document.getElementById('stability-info').innerText = Math.floor((tDone / (tTotal || 1)) * 100) + "%";
    
    if (state.exams.length > 0) {
        const next = new Date(Math.min(...state.exams.map(e => new Date(e.date))));
        document.getElementById('countdown-info').innerText = Math.ceil((next - new Date()) / 86400000);
    }

    const homeTasks = document.getElementById('home-today-tasks');
    if (state.plan[today]) {
        homeTasks.innerHTML = state.plan[today].map(p => `
            <div class="mission-card">
                <div><small>${p.subject}</small><br><b>${p.matName}</b></div>
                <div style="font-family:'Orbitron'; color:var(--accent);">${p.amount} <small>${p.unit}</small></div>
            </div>
        `).join('');
    } else { homeTasks.innerHTML = "<p style='opacity:0.5; text-align:center;'>計画が未生成です</p>"; }

    // --- PROGRESS ---
    const progList = document.getElementById('progress-list');
    progList.innerHTML = state.exams.map(e => e.materials.map(m => {
        if (m.type === 'std') {
            const doneSet = new Set(state.logs.filter(l => l.matId === m.id).map(l => l.label));
            return `<div class="glass-card">
                <small>${e.subject}</small> <h3>${m.name}</h3>
                ${m.tasks.map(t => `<div onclick="updateProgress(${m.id}, '${t.label}', true)" class="unit-chip ${doneSet.has(t.label)?'done':''}">${t.label}</div>`).join('')}
            </div>`;
        } else {
            const perc = Math.floor((m.doneCount / (m.total * m.rounds)) * 100);
            return `<div class="glass-card">
                <small>${e.subject}</small> <h3>${m.name}</h3>
                <div class="vol-progress-bar"><div class="vol-progress-fill" style="width:${perc}%"></div></div>
                <div style="display:flex; align-items:center; gap:10px;">
                    累計進捗: <input type="number" value="${m.doneCount}" style="width:100px; margin:0;" onchange="updateProgress(${m.id}, this.value)"> / ${m.total * m.rounds} ${m.unit}
                </div>
            </div>`;
        }
    }).join('')).join('');

    // --- PLAN ---
    const fullPlan = document.getElementById('full-plan-list');
    fullPlan.innerHTML = Object.keys(state.plan).sort().map(d => `
        <div class="glass-card" style="padding:10px 20px;">
            <small style="color:var(--accent); font-family:'Orbitron';">${d}</small>
            ${state.plan[d].map(p => `<div style="font-size:0.8rem;">${p.subject} ＞ ${p.matName} : ${p.amount}${p.unit}</div>`).join('')}
        </div>
    `).join('');

    // --- SETTINGS LIST ---
    const setList = document.getElementById('settings-list');
    setList.innerHTML = state.exams.map(e => e.materials.map(m => `
        <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px;">
            <div><small>${e.subject}</small><br><b>${m.name}</b></div>
            <button class="danger" onclick="deleteMaterial(${e.id}, ${m.id})">削除</button>
        </div>
    `).join('')).join('');
}

function deleteMaterial(eId, mId) {
    const ex = state.exams.find(e => e.id === eId);
    if (ex) {
        ex.materials = ex.materials.filter(m => m.id !== mId);
        if (ex.materials.length === 0) state.exams = state.exams.filter(e => e.id !== eId);
        state.logs = state.logs.filter(l => l.matId !== mId);
        render();
    }
}
</script>
</body>
</html>

    <script>const runBtn = document.getElementById("runBtn");
const status = document.getElementById("status");

function renderStatus() {
  const time = new Date().toLocaleTimeString();
  status.textContent = "Preview refreshed at " + time;
  status.style.fontWeight = "800";
  status.style.color = "#4a36ff";
}

runBtn.addEventListener("click", renderStatus);
</script>
  </body>
</html>

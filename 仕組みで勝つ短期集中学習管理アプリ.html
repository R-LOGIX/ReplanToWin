<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習計画アプリ</title>

<style>
body{
  font-family: sans-serif;
  margin:20px;
  background:#f5f7fa;
}
h2{
  margin-top:30px;
}
input,select,button{
  margin:5px 0;
  padding:6px;
}
button{
  cursor:pointer;
}
.card{
  background:white;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.today{
  background:#fff3cd;
}
.date-block{
  margin-bottom:20px;
}
.small{
  font-size:12px;
  color:gray;
}
</style>
</head>
<body>

<h1>学習計画アプリ</h1>

<h2>教材登録</h2>

<select id="subject">
  <option>英語</option>
  <option>数学</option>
  <option>国語</option>
  <option>理科</option>
  <option>社会</option>
  <option>情報</option>
  <option>その他</option>
</select><br>

教材名:<br>
<input id="book"><br>

単位（ページ/番など）:<br>
<input id="unit" value="番"><br>

範囲（例:1-4,6-8,10）:<br>
<input id="ranges"><br>

周回数:<br>
<input type="number" id="cycles" value="1"><br>

学習日（複数選択可）:<br>
<input type="date" id="dateInput">
<button onclick="addDate()">追加</button>
<div id="selectedDates" class="small"></div>

<br>
<button onclick="addTask()">追加</button>

<h2>進捗入力</h2>
タスクID:<br>
<input id="progressId"><br>
周回:<br>
<input type="number" id="progressCycle"><br>
from:<br>
<input id="progressFrom"><br>
to:<br>
<input id="progressTo"><br>
<button onclick="addProgress()">進捗記録</button>

<h2>操作</h2>
<button onclick="showToday()">今日表示</button>
<button onclick="showAll()">全体表示</button>
<button onclick="replan()">計画を立て直す</button>
<button onclick="deleteTask()">削除</button>

<h2>表示</h2>
<div id="output"></div>

<script>
let tasks = [];
let selectedDates = [];
let nextId = 1;
let schedule = {};

function addDate(){
  const d = document.getElementById("dateInput").value;
  if(d && !selectedDates.includes(d)){
    selectedDates.push(d);
    renderDates();
  }
}

function renderDates(){
  document.getElementById("selectedDates").innerText =
    "選択日: " + selectedDates.join(", ");
}

function parseRanges(text){
  let result = [];
  text.split(",").forEach(part=>{
    if(part.includes("-")){
      let [a,b]=part.split("-").map(Number);
      for(let i=a;i<=b;i++) result.push(i);
    }else{
      result.push(Number(part));
    }
  });
  return result;
}

function compressRanges(arr){
  let result=[];
  let start=arr[0];
  let prev=arr[0];
  for(let i=1;i<=arr.length;i++){
    if(arr[i]!==prev+1){
      if(start===prev){
        result.push(start);
      }else{
        result.push(start+"-"+prev);
      }
      start=arr[i];
    }
    prev=arr[i];
  }
  return result.join(",");
}

function addTask(){
  const task = {
    id: nextId++,
    subject: subject.value,
    book: book.value,
    unit: unit.value,
    ranges: parseRanges(ranges.value),
    cycles: Number(cycles.value),
    baseDates: [...selectedDates],
    progress: []
  };
  tasks.push(task);
  selectedDates=[];
  renderDates();
  buildSchedule();
  alert("追加完了 ID:"+task.id);
}

function buildSchedule(){
  schedule = {};
  tasks.forEach(task=>{
    let full=[];
    for(let c=1;c<=task.cycles;c++){
      full = full.concat(task.ranges);
    }
    let perDay = Math.ceil(full.length / task.baseDates.length);
    let index=0;
    task.baseDates.forEach(date=>{
      if(!schedule[date]) schedule[date]=[];
      let slice = full.slice(index,index+perDay);
      if(slice.length>0){
        schedule[date].push({
          taskId:task.id,
          subject:task.subject,
          book:task.book,
          unit:task.unit,
          items:slice
        });
      }
      index+=perDay;
    });
  });
}

function renderSchedule(filterToday=false){
  const out=document.getElementById("output");
  out.innerHTML="";
  const today=new Date().toISOString().slice(0,10);

  Object.keys(schedule).forEach(date=>{
    if(filterToday && date!==today) return;
    const div=document.createElement("div");
    div.className="date-block";
    if(date===today) div.classList.add("today");

    div.innerHTML="<h3>"+date+"</h3>";
    schedule[date].forEach(item=>{
      let compressed=compressRanges(item.items);
      div.innerHTML+=
        `<div class="card">
        【${item.subject}】${item.book} ${compressed}${item.unit}
        <div class="small">ID:${item.taskId}</div>
        </div>`;
    });
    out.appendChild(div);
  });
}

function showToday(){
  renderSchedule(true);
}

function showAll(){
  renderSchedule(false);
}

function addProgress(){
  const id=Number(progressId.value);
  const task=tasks.find(t=>t.id===id);
  if(!task) return alert("ID不正");
  task.progress.push({
    cycle:Number(progressCycle.value),
    from:Number(progressFrom.value),
    to:Number(progressTo.value)
  });
  alert("記録完了");
}

function replan(){
  tasks.forEach(task=>{
    let done=[];
    task.progress.forEach(p=>{
      for(let i=p.from;i<=p.to;i++) done.push(i);
    });
    task.ranges = task.ranges.filter(x=>!done.includes(x));
    task.progress=[];
  });
  buildSchedule();
  alert("再計画完了");
}

function deleteTask(){
  const id=Number(prompt("削除するID"));
  tasks = tasks.filter(t=>t.id!==id);
  buildSchedule();
  alert("削除完了");
}
</script>

</body>
</html>
